# Builds both tiers, runs the unit tests and lint on every push and pull
# request. Nothing here signs or publishes anything: the release key never
# leaves the developer's machine, so CI builds are debug builds and an
# unsigned release build (which is what lint inspects).
name: Android

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (release)
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
