# Builds both tiers, runs the unit tests and lint on every push and pull
# request. Nothing here signs or publishes anything: the release key never
# leaves the developer's machine, so CI builds are debug builds and an
# unsigned release build (which is what lint inspects).
name: Android

on:
  push:
    branches: [ main, 'redesign/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle comes from the checked-in wrapper; cache its downloads with the
      # GitHub-made cache action so the repo can stay on "GitHub actions only".
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testStoreDebugUnitTest

      - name: Lint (release)
        run: ./gradlew --no-daemon :app:lintStoreRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleStoreDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
